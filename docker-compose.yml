name: lemma

services:
  lemma-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5433:5432"
    volumes:
      - lemma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lemma-core:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      # Inside the compose network Postgres is reachable at lemma-postgres:5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@lemma-postgres:5432/${POSTGRES_DB}
      DATA_DIR: /data
      EVALS_DIR: /evals
      UPLOADS_DIR: /uploads
      TYPES_OUT: /types/geometry.ts
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      # Golden CAD files: read by tests, written by `make golden`. Never baked into the image.
      - ./evals:/evals
      # Generated TypeScript types for the desktop app (`make types`).
      - ./desktop/src/renderer/src/types:/types
      - lemma-uploads:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      lemma-postgres:
        condition: service_healthy

volumes:
  lemma-pgdata:
  lemma-uploads:
