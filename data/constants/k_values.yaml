# Loss coefficients (K) for fittings. Bump `version` on any change; datasets record it.
# Validated on startup by app.constants (the app refuses to start on an invalid file).
#
# Values are Crane TP-410 multiples of f_T evaluated at f_T = 0.023 (1 in. nominal,
# clean commercial steel), except entrance/exit which are absolute. ALL entries are
# status: unverified until Rohith checks them against the book and flips the status.
# Unverified entries are always reported as "family" (approximate), never "exact".
# A valve_type that matches only a family resolves to the FIRST entry of that family here.
# This table is never returned by the API; only resolved values for a user's components.
version: "2026.10.1"
entries:
  ball_valve:
    value: 0.069
    family: valve_ball
    source: "Crane TP-410, A-28: ball valve, full port, K = 3 f_T"
    status: unverified
  ball_valve_trunnion:
    value: 0.069
    family: valve_ball
    source: "Crane TP-410, A-28: ball valve, full port (beta = 1), K = 3 f_T"
    status: unverified
    notes: "Reduced-port balls need Crane's beta formula; not covered."
